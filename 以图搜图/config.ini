[Global]
;自动更新索引，启用后将每小时自动更新一次
IndexAutoUpdate=true

;启动http服务，启动后可以调用HTTP API
RunServer=false
;Http服务端口号
HttpPort=5000

;========== 视频播放器定位配置 ==========
;双击/预览点击视频结果时，自动跳到命中时间戳打开。
;全部模板行带 # 前缀 = 未指定播放器 → 自动探测 mpv > PotPlayer > VLC > MPC-HC/BE（仅标准安装路径）；
;使用方式：把你要用的播放器那两行的 # 删掉，并把 PlayerPath 改成你实际的安装位置即可。
;占位符：{file}=视频路径　{seconds}=命中秒数　{hms}=hh:mm:ss 时间格式
;
;---- mpv（支持绿色版，指向解压位置即可）----
#PlayerPath=D:\tools\mpv\mpv.exe
#PlayerArgs=--start={seconds} "{file}"
;
;---- PotPlayer ----
#PlayerPath=C:\Program Files\DAUM\PotPlayer\PotPlayerMini64.exe
#PlayerArgs="{file}" /seek={hms}
;
;---- VLC ----
#PlayerPath=C:\Program Files\VideoLAN\VLC\vlc.exe
#PlayerArgs=--start-time={seconds} "{file}"
;
;---- MPC-HC ----
#PlayerPath=C:\Program Files\MPC-HC\mpc-hc64.exe
#PlayerArgs="{file}" /start {hms}
;
;---- MPC-BE ----
#PlayerPath=C:\Program Files\MPC-BE x64\mpc-be64.exe
#PlayerArgs="{file}" /start {hms}
;
;---- 其他播放器：查其官方命令行文档，用上面的占位符自行拼装两行 ----
;（注意：只启用一组，别把多组的 # 同时删掉）

;是否允许强制以管理员身份运行（默认关闭。数据文件保存在程序所在目录，
;仅当程序放在 Program Files 等受保护目录时才需要开启提权；
;注意：提权会导致从资源管理器拖放搜索失效）
RunAsAdmin=false
