[Global]
;自动更新索引，启用后将每小时自动更新一次
IndexAutoUpdate=true

;启动http服务，启动后可以调用HTTP API
RunServer=false
;Http服务端口号
HttpPort=5000

;视频播放器exe完整路径（双击/预览点击视频结果时定位到命中时间戳）：
;留空自动探测 mpv > PotPlayer > VLC > MPC-HC/BE；探测不到按系统默认关联打开
PlayerPath=
;播放器参数模板（可选，配合PlayerPath）：{file}=视频路径，{seconds}=命中秒数
;例：--start={seconds} "{file}"
PlayerArgs=

;是否允许强制以管理员身份运行（默认关闭。数据文件保存在程序所在目录，
;仅当程序放在 Program Files 等受保护目录时才需要开启提权；
;注意：提权会导致从资源管理器拖放搜索失效）
RunAsAdmin=false
