name: build-and-package

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ffmpeg/ffprobe 不随源码分发（>100MB），CI 里拉官方 essentials 包；缓存避免每次重下
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg.zip
          key: ffmpeg-essentials-v1
          restore-keys: |
            ffmpeg-essentials-

      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip

      - name: Extract ffmpeg/ffprobe to tools\
        shell: pwsh
        run: |
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          New-Item -ItemType Directory -Force "以图搜图/tools" | Out-Null
          Get-ChildItem ffmpeg-tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination "以图搜图/tools"

      - name: Restore
        run: dotnet restore 以图搜图.sln

      - name: Build
        run: dotnet build 以图搜图.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/ImageSearch.Tests/ImageSearch.Tests.csproj -c Release --no-build

      - name: Publish (framework-dependent win-x64)
        run: dotnet publish 以图搜图/以图搜图.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ImageSearch-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageSearch-win-x64
          path: ImageSearch-win-x64.zip
          retention-days: 30

      # 推 v* 标签时自动发布 Release 并附带 zip
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ImageSearch-win-x64.zip
          generate_release_notes: true
